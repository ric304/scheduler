apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-ops
  namespace: scheduler
  labels:
    app.kubernetes.io/name: scheduler-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler-ops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler-ops
    spec:
      containers:
        - name: ops
          image: scheduler-worker:dev  # Same image as worker, different command
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: SCHEDULER_DEPLOYMENT
              value: "k8s"
            - name: DJANGO_DEBUG
              value: "True"
            - name: DJANGO_ALLOWED_HOSTS
              value: "*"
            - name: SCHEDULER_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: scheduler-redis-credentials
                  key: REDIS_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: scheduler-db-credentials
                  key: DATABASE_URL
            - name: DJANGO_SETTINGS_MODULE
              value: "scheduler_project.settings"
            - name: DJANGO_SUPERUSER_USERNAME
              value: "admin"
            - name: DJANGO_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scheduler-ops-credentials
                  key: ADMIN_PASSWORD
                  optional: true
          livenessProbe:
            httpGet:
              path: /ops/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ops/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: tls
          secret:
            secretName: scheduler-tls
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler-ops
  namespace: scheduler
  labels:
    app.kubernetes.io/name: scheduler-ops
spec:
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
      nodePort: 30800
  selector:
    app.kubernetes.io/name: scheduler-ops
